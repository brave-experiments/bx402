name: start bx402
description: Build the service and start it for an e2e run.

inputs:
  brave-search-api-key:
    description: Brave Search API key the server forwards upstream
    required: true
  x402-facilitator-url:
    description: >-
      x402 facilitator the server verifies and settles against. Empty leaves
      X402_FACILITATOR_URL unset, for runs that disable the x402 rail.
    required: false
    default: ""
  enabled-rails:
    description: >-
      ENABLED_RAILS value for the server. Empty leaves the variable unset,
      enabling both rails.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - name: Enable pnpm
      shell: bash
      # The version comes from the packageManager field in package.json.
      run: corepack enable
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build
      shell: bash
      # Compiled here rather than shared as an artifact: the build is seconds,
      # and the service needs its dependencies installed beside it anyway.
      run: pnpm build
    - name: Start bx402
      shell: bash
      env:
        BRAVE_SEARCH_API_KEY: ${{ inputs.brave-search-api-key }}
        X402_FACILITATOR_URL: ${{ inputs.x402-facilitator-url }}
        ENABLED_RAILS: ${{ inputs.enabled-rails }}
        ALLOW_TESTNET: "true"
      run: |
        # An empty input means "not provided": the server must see the variable
        # as unset, not as an empty string (an empty ENABLED_RAILS is a startup
        # error by design).
        if [ -z "$ENABLED_RAILS" ]; then unset ENABLED_RAILS; fi
        if [ -z "$X402_FACILITATOR_URL" ]; then unset X402_FACILITATOR_URL; fi
        # The MPP SDK refuses a secret under 32 bytes, which this clears.
        MPP_SECRET_KEY=$(openssl rand -hex 32) node ts/dist/main.js > server.log 2>&1 &
        for _ in $(seq 1 30); do
          curl -sf -o /dev/null http://localhost:8080/health && exit 0
          sleep 1
        done
        echo "server never became healthy" >&2
        exit 1
