name: start bx402
description: Download the built bx402 artifact and start it for an e2e run.

inputs:
  brave-search-api-key:
    description: Brave Search API key the server forwards upstream
    required: true
  x402-facilitator-url:
    description: x402 facilitator the server verifies and settles against
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: bx402-debug
    - name: Start bx402
      shell: bash
      env:
        BRAVE_SEARCH_API_KEY: ${{ inputs.brave-search-api-key }}
        X402_FACILITATOR_URL: ${{ inputs.x402-facilitator-url }}
        ALLOW_TESTNET: "true"
      run: |
        chmod +x bx402
        MPP_SECRET_KEY=$(openssl rand -hex 32) ./bx402 > server.log 2>&1 &
        for _ in $(seq 1 30); do
          curl -sf -o /dev/null http://localhost:8080/health && exit 0
          sleep 1
        done
        echo "server never became healthy" >&2
        exit 1
