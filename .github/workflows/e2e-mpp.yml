name: e2e-mpp

on:
  # No push trigger: each passing leg spends a Brave search from the free tier.
  # The daily run catches client releases between dispatches.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never overlap paid runs, and never cancel one mid-payment.
concurrency:
  group: e2e-mpp
  cancel-in-progress: false

env:
  MPP_RPC_URL: https://rpc.moderato.tempo.xyz

jobs:
  paid-search:
    name: ${{ matrix.client }} pays on Moderato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # One entry per MPP client, each backed by a matching
        # .github/scripts/e2e/mpp/<client>.sh.
        client: [mppx, tempo-request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/start-bx402
        with:
          brave-search-api-key: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          enabled-rails: mpp
      - name: Pay for a search
        env:
          # The Tempo installer verifies the release build attestation through
          # an authenticated gh, and reads the release list without hitting the
          # anonymous rate limit. Its other path, a GPG signature, cannot fetch
          # the signing key.
          GH_TOKEN: ${{ github.token }}
        # Run outside the checkout. The client installs its own packages with
        # npm, and npm cannot reconcile the tree pnpm lays out for the service:
        # it walks into node_modules/.pnpm and dies on a peer conflict there.
        run: |
          mkdir -p "$RUNNER_TEMP/client"
          cd "$RUNNER_TEMP/client"
          bash "$GITHUB_WORKSPACE/.github/scripts/e2e/mpp/${{ matrix.client }}.sh"
      - name: Show logs
        if: failure()
        run: |
          cat server.log || true
          cat "$RUNNER_TEMP/client/client.log" || true
          # The status line and headers the client saw, which is the only place a
          # rejected payment or a non-200 from Brave Search shows up.
          cat "$RUNNER_TEMP/client/response.txt" || true
