name: e2e-mpp

on:
  # Every push plus a daily heartbeat that catches client releases between
  # pushes. Each run bills one successful Brave search per client, so the
  # daily cron keeps the combined rate inside the free tier.
  push:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never overlap paid runs, and never cancel one mid-payment.
concurrency:
  group: e2e-mpp
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MPP_RPC_URL: https://rpc.moderato.tempo.xyz

jobs:
  paid-search:
    name: ${{ matrix.client }} pays on Moderato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One entry per MPP client, each backed by a matching
        # .github/scripts/mpp-pay-<client>.sh. mppx is the primary client;
        # tempo request and agentcash join once verified against Moderato.
        client: [mppx]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build
      - name: Build
        run: cargo build --locked
      - name: Start bx402 against Moderato
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          X402_FACILITATOR_URL: http://facilitator.invalid
          ALLOW_TESTNET: "true"
        run: |
          MPP_SECRET_KEY=$(openssl rand -hex 32) ./target/debug/bx402 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "server never became healthy" >&2
          exit 1
      - name: Pay for a search
        run: bash .github/scripts/mpp-pay-${{ matrix.client }}.sh
      - name: Show logs
        if: failure()
        run: |
          cat server.log || true
          cat client.log || true
