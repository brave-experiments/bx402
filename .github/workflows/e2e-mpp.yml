name: e2e-mpp

on:
  # No push trigger: each passing leg spends a Brave search from the free tier.
  # The daily run catches client releases between dispatches.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never overlap paid runs, and never cancel one mid-payment.
concurrency:
  group: e2e-mpp
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MPP_RPC_URL: https://rpc.moderato.tempo.xyz

jobs:
  build:
    name: build bx402
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
      - name: Build
        run: cargo build --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bx402-debug
          path: target/debug/bx402
          retention-days: 1

  paid-search:
    name: ${{ matrix.client }} pays on Moderato
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # One entry per MPP client, each backed by a matching
        # .github/scripts/e2e/mpp/<client>.sh.
        client: [mppx, tempo-request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/start-bx402
        with:
          brave-search-api-key: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          # The x402 rail is undriven here, so any parseable URL satisfies startup.
          x402-facilitator-url: http://facilitator.invalid
      - name: Pay for a search
        run: bash .github/scripts/e2e/mpp/${{ matrix.client }}.sh
      - name: Show logs
        if: failure()
        run: |
          cat server.log || true
          cat client.log || true
          # The status line and headers the client saw, which is the only place a
          # rejected payment or a non-200 from Brave Search shows up.
          cat response.txt || true
