name: e2e-mpp

on:
  # No push trigger: each passing leg spends a Brave search from the free tier.
  # The daily run catches client releases between dispatches.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never overlap paid runs, and never cancel one mid-payment.
concurrency:
  group: e2e-mpp
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MPP_RPC_URL: https://rpc.moderato.tempo.xyz

jobs:
  build:
    name: build bx402
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Show toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build
      - name: Build
        run: cargo build --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bx402-debug
          path: target/debug/bx402
          retention-days: 1

  paid-search:
    name: ${{ matrix.client }} pays on Moderato
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One entry per MPP client, each backed by a matching
        # .github/scripts/e2e/mpp/<client>.sh.
        client: [mppx, tempo-request]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bx402-debug
      - name: Start bx402 against Moderato
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          X402_FACILITATOR_URL: http://facilitator.invalid
          ALLOW_TESTNET: "true"
        run: |
          chmod +x bx402
          MPP_SECRET_KEY=$(openssl rand -hex 32) ./bx402 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "server never became healthy" >&2
          exit 1
      - name: Pay for a search
        run: bash .github/scripts/e2e/mpp/${{ matrix.client }}.sh
      - name: Show logs
        if: failure()
        run: |
          cat server.log || true
          cat client.log || true
