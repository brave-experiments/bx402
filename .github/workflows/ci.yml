name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on branches/PRs, but let every master run finish — a
# cancelled run counts as a failed required check on master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ts:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pnpm
        # The version comes from the packageManager field in package.json.
        run: corepack enable
      - name: Install
        # Fails if pnpm-lock.yaml does not match package.json, which is the
        # lockfile check for the npm side.
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test

  audit:
    name: pnpm-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit
      - name: Check for duplicate packages
        # The npm side of the single-version rule. Two copies of a library that
        # decodes payments could disagree, which is why `ox` is pinned to one
        # version in pnpm-workspace.yaml.
        run: pnpm dedupe --check
