services:
  bx402:
    build: .
    ports:
      - "8080:8080"
      # Metrics. Published here for local scraping; a real deployment keeps this
      # port inside the network.
      - "8090:8090"
    environment:
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      # The public testnet facilitator. Production points this at the
      # Coinbase-hosted one and sets the CDP key pair beside it.
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      MPP_RPC_URL: ${MPP_RPC_URL:-https://rpc.moderato.tempo.xyz}
      MPP_SECRET_KEY: ${MPP_SECRET_KEY}
      # The compose stack is the testnet environment. Production unsets this.
      ALLOW_TESTNET: ${ALLOW_TESTNET:-true}
